name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Generate release notes
        # Ghi ra ngoai thu muc repo. Truoc day ghi vao release-notes.md o goc,
        # nhung file do nam trong .gitignore nen `goreleaser --clean` xoa mat
        # no truoc khi doc -> release fail voi loi "open release-notes.md: no
        # such file or directory". $RUNNER_TEMP khong nam trong repo nen
        # --clean khong cham vao.
        run: .github/scripts/gen-changelog.sh > "${{ runner.temp }}/release-notes.md"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            release --clean
            --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
