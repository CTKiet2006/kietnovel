# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test -count=1 ./...

builds:
  - id: kietnovel
    main: ./cmd/kietnovel
    binary: kietnovel
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  # Windows tach rieng: GoReleaser v2 khong cho loc goos o cap archive, nen
  # tach build va archive rieng de ra duoc file .zip dung cach Windows dung.
  - id: kietnovel-windows
    main: ./cmd/kietnovel
    binary: kietnovel
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    goos:
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: kietnovel-archive
    ids:
      - kietnovel
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

  - id: kietnovel-windows
    ids:
      - kietnovel-windows
    formats:
      - zip
    files:
      - README.md
      - LICENSE
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  groups:
    - title: "New Features"
      regexp: '^feat'
    - title: "Bug Fixes"
      regexp: '^fix'
    - title: "Performance"
      regexp: '^perf'
    - title: "Refactor"
      regexp: '^refactor'
    - title: "Others"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"

release:
  github:
    owner: CTKiet2006
    name: kietnovel
